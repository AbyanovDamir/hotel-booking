server:
  port: 8082

spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-123456}
  internal-key: ${INTERNAL_API_KEY:change-this-in-production}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    name: ${LOG_FILE:}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [trace=%X{traceId:-} request=%X{requestId:-}] %logger{36} - %msg%n"
