server:
  port: 8081

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  cloud:
    openfeign:
      client:
        config:
          hotel-service:
            connectTimeout: 2000
            readTimeout: 2000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-123456}
    lifetime: PT1H
  internal-key: ${INTERNAL_API_KEY:change-this-in-production}

resilience4j:
  retry:
    instances:
      hotelClient:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.example.booking.exception.HotelConflictException
  circuitbreaker:
    instances:
      hotelClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        ignore-exceptions:
          - com.example.booking.exception.HotelConflictException

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries

logging:
  file:
    name: ${LOG_FILE:}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [trace=%X{traceId:-} booking=%X{bookingId:-}] %logger{36} - %msg%n"
