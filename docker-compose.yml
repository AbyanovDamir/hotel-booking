x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [hotel-network]
  logging: *app-logging

services:
  booking-db:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking-local-password}
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 20

  hotel-db:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD:-hotel-local-password}
    volumes:
      - hotel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 20

  eureka-server:
    <<: *service-defaults
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    expose: ["8761"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  hotel-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: hotel-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://hotel-db:5432/hotel
      DB_USER: hotel
      DB_PASSWORD: ${HOTEL_DB_PASSWORD:-hotel-local-password}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-123456}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-production}
    expose: ["8082"]
    depends_on:
      hotel-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  booking-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://booking-db:5432/booking
      DB_USER: booking
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking-local-password}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-123456}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-in-production}
    expose: ["8081"]
    depends_on:
      booking-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-123456}
    ports: ["8080:8080"]
    depends_on:
      eureka-server:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

volumes:
  booking-db-data:
  hotel-db-data:

networks:
  hotel-network:
    driver: bridge