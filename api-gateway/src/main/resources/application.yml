server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/auth/**,/api/bookings/**
            - id: hotel-service-hotels
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**
            - id: hotel-service-rooms
              uri: lb://hotel-service
              predicates:
                - Path=/api/rooms,/api/rooms/*,/api/rooms/recommend

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-123456}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
